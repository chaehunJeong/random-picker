<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - 페이지를 찾을 수 없습니다 | 랜덤 선택기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .suggestions {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .suggestions h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 80px;
            }

            .emoji {
                font-size: 60px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="emoji">🎲</div>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p>
            죄송합니다. 요청하신 페이지가 존재하지 않거나 이동했을 수 있습니다.<br>
            아래 버튼을 클릭하여 홈으로 돌아가세요.
        </p>
        <a href="/" class="btn">🏠 홈으로 돌아가기</a>

        <div class="suggestions">
            <h2>🔍 다른 페이지를 찾으시나요?</h2>
            <div class="links">
                <a href="/" class="link">메인 페이지</a>
                <a href="/how-to-use.html" class="link">사용법</a>
                <a href="/privacy.html" class="link">개인정보처리방침</a>
                <a href="/terms.html" class="link">이용약관</a>
            </div>
        </div>
    </div>

    <script>
        // 3초 후 자동으로 홈으로 리다이렉트 (선택사항)
        // setTimeout(() => {
        //     window.location.href = '/';
        // }, 3000);
    </script>
</body>
</html>
